openapi: 3.0.3
info:
  title: 'OUAGA CHAP API Documentation'
  description: 'API de la plateforme OUAGA CHAP — livraison de repas à Ouagadougou. Gestion des commandes, paiements, suivi en temps réel et notifications.'
  version: 1.0.0
servers:
  -
    url: 'https://ouagachap.pro'
tags:
  -
    name: Addresses
    description: ''
  -
    name: Authentification
    description: "\nEndpoints pour l'authentification par OTP et la gestion du profil utilisateur."
  -
    name: Commandes
    description: "\nEndpoints pour gérer les commandes de livraison."
  -
    name: Configuration
    description: "\nEndpoints pour obtenir la configuration de l'application."
  -
    name: Coursiers
    description: "\nEndpoints réservés aux coursiers pour gérer leur disponibilité, localisation et commandes."
  -
    name: Endpoints
    description: ''
  -
    name: 'Notifications In-App'
    description: "\nAPIs pour gérer les notifications dans l'application"
  -
    name: Paiements
    description: "\nEndpoints pour gérer les paiements Mobile Money."
  -
    name: 'Portefeuille Client'
    description: "\nAPIs pour la gestion du portefeuille client (recharge)"
  -
    name: 'Portefeuille Coursier'
    description: "\nAPIs pour la gestion du portefeuille et des retraits des coursiers"
  -
    name: Services
    description: "\nAPIs pour la liste des services disponibles"
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Authentification via Laravel Sanctum. Envoyez le header `Authorization: Bearer {token}` obtenu via `POST /api/v1/auth/login`.'
security:
  -
    default: []
paths:
  /api/v1/addresses:
    post:
      summary: 'Create a new saved address'
      operationId: createANewSavedAddress
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Addresses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  description: validation.max.
                  example: b
                address:
                  type: string
                  description: validation.max.
                  example: 'n'
                latitude:
                  type: number
                  description: validation.between.
                  example: -90
                longitude:
                  type: number
                  description: validation.between.
                  example: -179
                contact_name:
                  type: string
                  description: validation.max.
                  example: m
                  nullable: true
                contact_phone:
                  type: string
                  description: validation.max.
                  example: iyvdljnikhwaykcm
                  nullable: true
                instructions:
                  type: string
                  description: validation.max.
                  example: 'y'
                  nullable: true
                is_default:
                  type: boolean
                  description: ''
                  example: true
                type:
                  type: string
                  description: ''
                  example: other
                  enum:
                    - home
                    - work
                    - other
              required:
                - label
                - address
                - latitude
                - longitude
  '/api/v1/addresses/{id}':
    put:
      summary: 'Update a saved address'
      operationId: updateASavedAddress
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Addresses
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  description: validation.max.
                  example: b
                address:
                  type: string
                  description: validation.max.
                  example: 'n'
                latitude:
                  type: number
                  description: validation.between.
                  example: -90
                longitude:
                  type: number
                  description: validation.between.
                  example: -179
                contact_name:
                  type: string
                  description: validation.max.
                  example: m
                  nullable: true
                contact_phone:
                  type: string
                  description: validation.max.
                  example: iyvdljnikhwaykcm
                  nullable: true
                instructions:
                  type: string
                  description: validation.max.
                  example: 'y'
                  nullable: true
                is_default:
                  type: boolean
                  description: ''
                  example: false
                type:
                  type: string
                  description: ''
                  example: other
                  enum:
                    - home
                    - work
                    - other
    delete:
      summary: 'Delete a saved address'
      operationId: deleteASavedAddress
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Addresses
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the address.'
        example: architecto
        required: true
        schema:
          type: string
  '/api/v1/addresses/{id}/set-default':
    post:
      summary: 'Set an address as default'
      operationId: setAnAddressAsDefault
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Addresses
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the address.'
        example: architecto
        required: true
        schema:
          type: string
  /api/v1/courier/login:
    post:
      summary: 'Envoyer un OTP'
      operationId: envoyerUnOTP
      description: "Envoie un code OTP à 6 chiffres au numéro de téléphone spécifié.\nLe code expire après 5 minutes."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Code OTP envoyé avec succès.'
                  data:
                    expires_in: 300
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Code OTP envoyé avec succès.'
                  data:
                    type: object
                    properties:
                      expires_in:
                        type: integer
                        example: 300
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: 'Le numéro de téléphone au format Burkina Faso.'
                  example: '+22670123456'
              required:
                - phone
      security: []
  /api/v1/courier/verify-otp:
    post:
      summary: "Vérifier l'OTP"
      operationId: vrifierLOTP
      description: "Vérifie le code OTP et connecte/inscrit l'utilisateur.\nRetourne un token Bearer pour les requêtes authentifiées."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Connexion réussie.'
                  data:
                    user:
                      id: 1
                      name: John
                      phone: '+22670123456'
                      role: client
                    token: 1|abc123...
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Connexion réussie.'
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: John
                          phone:
                            type: string
                            example: '+22670123456'
                          role:
                            type: string
                            example: client
                      token:
                        type: string
                        example: 1|abc123...
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Code OTP invalide ou expiré.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Code OTP invalide ou expiré.'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: "Ce compte est un compte coursier. Veuillez utiliser l'application OUAGA CHAP Coursier."
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Ce compte est un compte coursier. Veuillez utiliser l'application OUAGA CHAP Coursier."
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: 'Le numéro de téléphone.'
                  example: '+22670123456'
                code:
                  type: string
                  description: 'Le code OTP à 6 chiffres.'
                  example: '123456'
                firebase_id_token:
                  type: string
                  description: validation.min.
                  example: cmyuwpwlvqwrsitcpscqldzsnrwtujwvlxjklqppwqbewtnnoqitpxntltcvipojsaus
                device_name:
                  type: string
                  description: "Nom de l'appareil."
                  example: 'iPhone 15'
                app_type:
                  type: string
                  description: "Type d'application (client ou courier)."
                  example: client
              required:
                - phone
                - code
      security: []
  /api/v1/auth/otp/send:
    post:
      summary: 'Envoyer un OTP'
      operationId: envoyerUnOTP
      description: "Envoie un code OTP à 6 chiffres au numéro de téléphone spécifié.\nLe code expire après 5 minutes."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Code OTP envoyé avec succès.'
                  data:
                    expires_in: 300
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Code OTP envoyé avec succès.'
                  data:
                    type: object
                    properties:
                      expires_in:
                        type: integer
                        example: 300
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: 'Le numéro de téléphone au format Burkina Faso.'
                  example: '+22670123456'
              required:
                - phone
      security: []
  /api/v1/auth/otp/verify:
    post:
      summary: "Vérifier l'OTP"
      operationId: vrifierLOTP
      description: "Vérifie le code OTP et connecte/inscrit l'utilisateur.\nRetourne un token Bearer pour les requêtes authentifiées."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Connexion réussie.'
                  data:
                    user:
                      id: 1
                      name: John
                      phone: '+22670123456'
                      role: client
                    token: 1|abc123...
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Connexion réussie.'
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: John
                          phone:
                            type: string
                            example: '+22670123456'
                          role:
                            type: string
                            example: client
                      token:
                        type: string
                        example: 1|abc123...
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Code OTP invalide ou expiré.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Code OTP invalide ou expiré.'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: "Ce compte est un compte coursier. Veuillez utiliser l'application OUAGA CHAP Coursier."
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Ce compte est un compte coursier. Veuillez utiliser l'application OUAGA CHAP Coursier."
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: 'Le numéro de téléphone.'
                  example: '+22670123456'
                code:
                  type: string
                  description: 'Le code OTP à 6 chiffres.'
                  example: '123456'
                firebase_id_token:
                  type: string
                  description: validation.min.
                  example: cmyuwpwlvqwrsitcpscqldzsnrwtujwvlxjklqppwqbewtnnoqitpxntltcvipojsaus
                device_name:
                  type: string
                  description: "Nom de l'appareil."
                  example: 'iPhone 15'
                app_type:
                  type: string
                  description: "Type d'application (client ou courier)."
                  example: client
              required:
                - phone
                - code
      security: []
  /api/v1/auth/register/courier:
    post:
      summary: 'Inscription coursier'
      operationId: inscriptionCoursier
      description: "Inscrit un nouvel utilisateur en tant que coursier.\nLe coursier doit ensuite être approuvé par un admin."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: "Inscription réussie. En attente d'approbation."
                  data:
                    id: 1
                    name: 'Ouédraogo Ibrahim'
                    role: courier
                    status: pending
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Inscription réussie. En attente d'approbation."
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Ouédraogo Ibrahim'
                      role:
                        type: string
                        example: courier
                      status:
                        type: string
                        example: pending
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: 'Numéro de téléphone.'
                  example: '+22670123456'
                name:
                  type: string
                  description: 'Nom complet.'
                  example: 'Ouédraogo Ibrahim'
                vehicle_type:
                  type: string
                  description: 'Type de véhicule (moto, vélo, voiture).'
                  example: moto
                vehicle_plate:
                  type: string
                  description: "Plaque d'immatriculation."
                  example: 12AB3456
                vehicle_model:
                  type: string
                  description: validation.max.
                  example: r
                email:
                  type: string
                  description: 'Email optionnel.'
                  example: ibrahim@example.com
              required:
                - phone
                - name
                - vehicle_type
      security: []
  /api/v1/auth/me:
    get:
      summary: 'Profil utilisateur'
      operationId: profilUtilisateur
      description: "Retourne les informations de l'utilisateur connecté."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    id: 1
                    name: John
                    phone: '+22670123456'
                    email: null
                    role: client
                    wallet_balance: 0
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: John
                      phone:
                        type: string
                        example: '+22670123456'
                      email:
                        type: string
                        example: null
                      role:
                        type: string
                        example: client
                      wallet_balance:
                        type: integer
                        example: 0
      tags:
        - Authentification
  /api/v1/auth/fcm-token:
    put:
      summary: "Update FCM token for push notifications\nPUT /api/v1/auth/fcm-token"
      operationId: updateFCMTokenForPushNotificationsPUTapiv1authfcmToken
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fcm_token:
                  type: string
                  description: validation.max.
                  example: b
                device_type:
                  type: string
                  description: ''
                  example: ios
                  enum:
                    - ios
                    - android
                  nullable: true
              required:
                - fcm_token
  /api/v1/auth/refresh-token:
    post:
      summary: 'Rafraîchir le token'
      operationId: rafrachirLeToken
      description: "Révoque le token actuel et en génère un nouveau.\nÀ appeler périodiquement par l'app mobile pour maintenir la session sécurisée."
      parameters: []
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: '{"success": true, "message": "Token rafraîchi avec succès.", "data": {"token": "2|xyz789...", "user": {...}}}'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Votre compte est suspendu.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Votre compte est suspendu.'
      tags:
        - Authentification
  /api/v1/auth/logout:
    post:
      summary: Déconnexion
      operationId: dconnexion
      description: "Révoque le token actuel de l'utilisateur."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Déconnexion réussie.'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Déconnexion réussie.'
      tags:
        - Authentification
  /api/v1/auth/logout-all:
    post:
      summary: 'Déconnexion de tous les appareils'
      operationId: dconnexionDeTousLesAppareils
      description: "Révoque tous les tokens de l'utilisateur."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Déconnexion de tous les appareils réussie.'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Déconnexion de tous les appareils réussie.'
      tags:
        - Authentification
  /api/v1/auth/account:
    delete:
      summary: 'Supprimer le compte'
      operationId: supprimerLeCompte
      description: "Supprime définitivement le compte de l'utilisateur et anonymise ses données (RGPD)."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Votre compte a été supprimé avec succès.'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Votre compte a été supprimé avec succès.'
      tags:
        - Authentification
  /api/v1/user/fcm-token:
    post:
      summary: "Update FCM token for push notifications\nPUT /api/v1/auth/fcm-token"
      operationId: updateFCMTokenForPushNotificationsPUTapiv1authfcmToken
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fcm_token:
                  type: string
                  description: validation.max.
                  example: b
                device_type:
                  type: string
                  description: ''
                  example: android
                  enum:
                    - ios
                    - android
                  nullable: true
              required:
                - fcm_token
  /api/v1/courier/profile:
    get:
      summary: 'Profil utilisateur'
      operationId: profilUtilisateur
      description: "Retourne les informations de l'utilisateur connecté."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    id: 1
                    name: John
                    phone: '+22670123456'
                    email: null
                    role: client
                    wallet_balance: 0
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: John
                      phone:
                        type: string
                        example: '+22670123456'
                      email:
                        type: string
                        example: null
                      role:
                        type: string
                        example: client
                      wallet_balance:
                        type: integer
                        example: 0
      tags:
        - Authentification
  /api/v1/courier/logout:
    post:
      summary: Déconnexion
      operationId: dconnexion
      description: "Révoque le token actuel de l'utilisateur."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Déconnexion réussie.'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Déconnexion réussie.'
      tags:
        - Authentification
  /api/v1/courier/logout-all:
    post:
      summary: 'Déconnexion de tous les appareils'
      operationId: dconnexionDeTousLesAppareils
      description: "Révoque tous les tokens de l'utilisateur."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Déconnexion de tous les appareils réussie.'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Déconnexion de tous les appareils réussie.'
      tags:
        - Authentification
  /api/v1/orders/estimate:
    post:
      summary: 'Estimer le prix'
      operationId: estimerLePrix
      description: 'Calcule une estimation de prix basée sur la distance entre les points de collecte et de livraison.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Estimation calculée.'
                  data:
                    distance_km: 2.5
                    estimated_price: 1500
                    estimated_duration_minutes: 15
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Estimation calculée.'
                  data:
                    type: object
                    properties:
                      distance_km:
                        type: number
                        example: 2.5
                      estimated_price:
                        type: integer
                        example: 1500
                      estimated_duration_minutes:
                        type: integer
                        example: 15
      tags:
        - Commandes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pickup_latitude:
                  type: number
                  description: 'Latitude du point de collecte.'
                  example: 12.3714
                pickup_longitude:
                  type: number
                  description: 'Longitude du point de collecte.'
                  example: -1.5197
                dropoff_latitude:
                  type: number
                  description: 'Latitude du point de livraison.'
                  example: 12.38
                dropoff_longitude:
                  type: number
                  description: 'Longitude du point de livraison.'
                  example: -1.51
                zone_id:
                  type: integer
                  description: 'ID de la zone (optionnel).'
                  example: 1
                  nullable: true
              required:
                - pickup_latitude
                - pickup_longitude
                - dropoff_latitude
                - dropoff_longitude
  /api/v1/orders:
    post:
      summary: 'Créer une commande'
      operationId: crerUneCommande
      description: 'Crée une nouvelle commande de livraison. Réservé aux clients.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Commande créée avec succès.'
                  data:
                    id: uuid
                    order_number: OC-20260120-ABCD
                    status: pending
                    total_price: 1500
